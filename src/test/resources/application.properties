# Test configuration: use in-memory H2 so tests (and CI) don't need a running PostgreSQL
spring.datasource.url=jdbc:h2:mem:car;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=YEAR
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
server.port=0
